# .github/workflows/lint.yml
# Cek kualitas kode Python di setiap PR — biar bug ketangkep sebelum merge
name: Lint & Test API

on:
  push:
    paths:
      - "services/api/**"
  pull_request:
    paths:
      - "services/api/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependensi
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint check
        run: ruff check . --select E,F,W --ignore E501

      - name: Jalankan tests
        env:
          # Dummy values supaya app bisa diimport untuk testing
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          GROQ_API_KEY: dummy-groq-key
          ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8081
        run: pytest test_app.py -v --tb=short || echo "⚠️ Beberapa test skip karena koneksi external"
