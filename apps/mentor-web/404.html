<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halaman Tidak Ditemukan - Aksaraku</title>
  <link rel="icon" type="image/png" href="./image/logo.png" />
  <link rel="stylesheet" href="./css/brand.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --workspace: #0B0F17;
      --panel: #161B26;
      --border: rgba(148, 163, 184, 0.18);
      --muted: #9CA3AF;
      --accent: #9BD1FF;
      --accent-strong: #123A63;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(18, 58, 99, 0.32), transparent 32%),
        radial-gradient(circle at 88% 84%, rgba(11, 37, 69, 0.3), transparent 34%),
        var(--workspace);
      color: #F3F4F6;
      font-family: "Inter", sans-serif;
    }

    .page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .content {
      width: min(100%, 560px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: enter 0.45s ease-out both;
    }

    .logo {
      width: 92px;
      margin: 0 auto 28px;
    }

    .code {
      width: 100%;
      margin: 0 auto;
      color: var(--accent);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 0.9;
      text-align: center;
    }

    h1 {
      margin: 28px 0 10px;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.1;
    }

    p {
      max-width: 420px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--accent-strong);
      color: #fff;
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-link:hover {
      background: #1b4d7c;
      transform: translateY(-2px);
    }

    .arrow { font-size: 1.1rem; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
      .home-link { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="content" aria-labelledby="page-title">
      <img class="logo" src="./image/logo.png" alt="Aksaraku" />
      <p class="code" aria-hidden="true">404</p>
      <h1 id="page-title">Halaman tidak ditemukan</h1>
      <p>Alamat yang kamu buka tidak tersedia atau mungkin sudah dipindahkan.</p>
      <a class="home-link" href="./index.html">
        <span class="arrow" aria-hidden="true">&#8592;</span>
        Kembali ke Beranda
      </a>
    </section>
  </main>
</body>
</html>
