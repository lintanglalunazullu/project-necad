# ==============================================================================
# Nginx Configuration — SMPN 2 Cibungbulang (Single VPS Architecture)
# ==============================================================================
# Domain Mapping:
# 1. smpn2cibungbulang.sch.id       → Website Sekolah (apps/school-web)
# 2. mentor.smpn2cibungbulang.sch.id → Portal AI Mentor (apps/mentor-web)
# 3. api.smpn2cibungbulang.sch.id    → Backend FastAPI (services/api port 3000)
#
# Pasang file ini di: /etc/nginx/sites-available/smpn2cibungbulang.conf
# Lalu symlink ke:    /etc/nginx/sites-enabled/
# ==============================================================================

# Gzip Compression Terpusat (Hemat bandwidth, load super cepat)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/rss+xml
    application/atom+xml
    image/svg+xml;

# ==============================================================================
# 1. WEBSITE SEKOLAH (smpn2cibungbulang.sch.id & www)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name smpn2cibungbulang.sch.id www.smpn2cibungbulang.sch.id;

    root /var/www/project-necad/apps/school-web;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching Aset Statis (Gambar, CSS, JS, Fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # HTML files: no-cache agar perubahan konten selalu realtime
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Error pages
    error_page 404 /index.html;
}

# ==============================================================================
# 2. PORTAL AI MENTOR (mentor.smpn2cibungbulang.sch.id)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name mentor.smpn2cibungbulang.sch.id;

    root /var/www/project-necad/apps/mentor-web;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching Aset Statis
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # HTML files: no-cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Routing SPA / Clean URL fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /index.html;
}

# ==============================================================================
# 3. BACKEND API FASTAPI (api.smpn2cibungbulang.sch.id)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.smpn2cibungbulang.sch.id;

    # Batas ukuran upload file materi PDF (25 Megabytes)
    client_max_body_size 25M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Header forwarding standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # PENTING UNTUK AI STREAMING:
        # Nonaktifkan buffer proxy agar respon streaming AI langsung mengalir ke browser
        proxy_buffering off;
        proxy_cache off;

        # Timeout diperpanjang untuk proses embedding dan respon AI panjang
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
