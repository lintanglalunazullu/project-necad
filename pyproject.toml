[project]
name = "project-necad"
version = "0.1.0"
description = "Aksaraku AI Mentor & School Website"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "supabase>=2.3.0,<3.0",
    "google-genai>=2.23.0,<3.0",
    "google-generativeai>=0.8.0,<1.0",
    "tenacity>=9.1.0,<10.0",
    "openai>=1.30.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "slowapi>=0.1.9,<1.0",
    "python-dotenv>=1.0.0,<2.0",
]

[tool.vercel]
entrypoint = "services.api.app:app"
